name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Marketplace package
        run: npm run package:pre-release -- --out perfchecker-vscode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: perfchecker-vscode
          path: perfchecker-vscode.vsix
