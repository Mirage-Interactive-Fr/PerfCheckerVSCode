name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install browser test tooling (development only)
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Validate advisor UI in a browser
        run: node test/advisor-panel.browser.cjs
      - name: Validate Marketplace package
        run: npm run package:pre-release -- --out perfchecker-vscode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: perfchecker-vscode-${{ matrix.os }}
          path: perfchecker-vscode.vsix
